<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chúc chị Mai Hoa 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&family=Pacifico&display=swap">
<style>
html{color-scheme:light}body{margin:0}
/* Layout: một tấm thiệp đứng giữa nền hoa rơi; số 20.10 lớn là điểm nhấn duy nhất */
:root{
  --bg:#fbeff1; --bg2:#f3e3f0; --card:#fffafb; --fg:#4a2f3d; --muted:#8a6b7b;
  --rose:#d9718f; --rose-soft:#f6c9d6; --lilac:#b79ad6; --line:#efd3dc;
  --display:"Pacifico","Comic Sans MS",cursive;
  --body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a1a28; --bg2:#38243a; --card:#3a2639; --fg:#f6e3ea; --muted:#c7a6b7;
  --rose:#f08aa8; --rose-soft:#6b3a52; --lilac:#c4a8e6; --line:#5a3a54; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a1a28; --bg2:#38243a; --card:#3a2639; --fg:#f6e3ea; --muted:#c7a6b7;
  --rose:#f08aa8; --rose-soft:#6b3a52; --lilac:#c4a8e6; --line:#5a3a54; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed var(--bg);
  color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.7;
  padding-block:40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; justify-content:center; align-items:flex-start;
}
#petals{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
.card{
  position:relative; z-index:1; width:100%; max-width:560px; min-width:0;
  background:var(--card); border:1px solid var(--line); border-radius:28px;
  padding:48px clamp(22px,6vw,48px) 40px;
  box-shadow:0 24px 60px -28px color-mix(in srgb,var(--rose) 55%,transparent);
  text-align:center;
}
.eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:0}
.date{
  font-family:var(--display); font-weight:400; font-size:clamp(70px,20vw,108px);
  line-height:1.15; margin:14px 0 6px; color:var(--rose); letter-spacing:-.02em;
  font-variant-numeric:lining-nums;
}
.date span{color:var(--lilac)}
h1{
  font-family:var(--display); font-weight:400;
  font-size:clamp(22px,5.6vw,28px); line-height:1.5; margin:0 0 28px; text-wrap:balance;
}
.msg{margin:0 auto 14px; max-width:44ch; text-wrap:pretty; color:var(--fg)}
.photo{margin:26px 0 30px; padding:0}
.photo img{display:block; width:100%; height:auto; border-radius:18px; border:6px solid var(--card); box-shadow:0 10px 30px -14px color-mix(in srgb,var(--rose) 60%,transparent)}
.wishes{list-style:none; padding:0; margin:30px 0; display:grid; gap:12px; text-align:left}
.wishes li{
  display:flex; gap:14px; align-items:baseline; padding:14px 16px; min-width:0;
  border:1px solid var(--line); border-radius:14px; background:color-mix(in srgb,var(--rose-soft) 35%,transparent);
}
.wishes b{font-family:var(--display); font-weight:400; color:var(--rose); white-space:nowrap}
.wishes span{min-width:0}
button{
  font:inherit; font-weight:500; color:#fff; background:var(--rose); border:0; border-radius:999px;
  padding:12px 28px; cursor:pointer; transition:transform .15s ease, filter .15s ease;
}
button:hover{filter:brightness(1.06); transform:translateY(-1px)}
button:focus-visible{outline:3px solid var(--lilac); outline-offset:3px}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>

</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<main class="card">
  <p class="eyebrow">Ngày Phụ nữ Việt Nam</p>
  <div class="date">20<span>.</span>10</div>
  <h1>Chúc chị Mai Hoa một ngày 20/10 vui vẻ!</h1>
  <p class="msg">Chúc chị Hoa tuổi mới tươi như Hoa, ngủ sớm để không bị đau đầu, hay cười, ăn đủ bữa và đặc biệt là nhớ uống đủ nước.</p>
  <p class="msg">Chúc "bông Hoa" luôn luôn xinh tươi!</p>
  <figure class="photo"><img src="hoa.jpg" alt="Chị Hoa trong cánh đồng hoa hướng dương"></figure>
  <button id="burst" type="button">Nhận thêm hoa</button>
</main>

<script>
(function(){
  var c=document.getElementById('petals'), x=c.getContext('2d'), W,H,dpr=Math.min(window.devicePixelRatio||1,2);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cols=['#f4a7bd','#f9c6d4','#d9a8e6','#fbd9e2','#e58aa7'];
  var ps=[];
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  function mk(y){return{x:Math.random()*W,y:y!=null?y:Math.random()*H,r:6+Math.random()*9,vy:.4+Math.random()*.9,
    vx:-.3+Math.random()*.6,a:Math.random()*6.28,va:(Math.random()-.5)*.03,sw:Math.random()*6.28,col:cols[(Math.random()*cols.length)|0],o:.55+Math.random()*.4}}
  function draw(p){
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=p.o;x.fillStyle=p.col;
    x.beginPath();x.moveTo(0,-p.r);x.bezierCurveTo(p.r*.9,-p.r*.6,p.r*.7,p.r*.7,0,p.r);
    x.bezierCurveTo(-p.r*.7,p.r*.7,-p.r*.9,-p.r*.6,0,-p.r);x.fill();x.restore();
  }
  function tick(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){var p=ps[i];
      p.sw+=.02;p.x+=p.vx+Math.sin(p.sw)*.5;p.y+=p.vy;p.a+=p.va;
      if(p.y>H+20){ps[i]=mk(-20)} draw(p);}
    requestAnimationFrame(tick);
  }
  size();addEventListener('resize',size);
  var n=reduce?14:Math.round(Math.min(46,Math.max(22,W/28)));
  for(var i=0;i<n;i++)ps.push(mk());
  if(reduce){for(var j=0;j<ps.length;j++)draw(ps[j])}else{tick()}
  document.getElementById('burst').addEventListener('click',function(){
    if(reduce)return;
    for(var k=0;k<30;k++){var p=mk(-10-Math.random()*H*.4);p.vy+=.6;ps.push(p)}
    if(ps.length>140)ps.splice(0,ps.length-140);
  });
})();
</script>
</body>
</html>
